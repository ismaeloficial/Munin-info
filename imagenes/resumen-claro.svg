<svg xmlns="http://www.w3.org/2000/svg" width="640" height="368" viewBox="0 0 640 368" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'Noto Sans', Helvetica, Arial, sans-serif" role="img" aria-label="En resumen: −61 % de contexto por llamada, −69 % de tokens nuevos por llamada, −77 % de relecturas, compactaciones de 16 a 1, la nota correcta entre los 5 primeros resultados el 85 % de las veces e instalación en menos de 30 segundos.">
<title>En resumen: −61 % de contexto por llamada, −69 % de tokens nuevos por llamada, −77 % de relecturas, compactaciones de 16 a 1, la nota correcta entre los 5 primeros resultados el 85 % de las veces e instalación en menos de 30 segundos.</title>
<rect x="0.5" y="0.5" width="311" height="111" rx="12" fill="#f6f8fa" stroke="#d1d9e0"/><rect x="14" y="22" width="4" height="68" rx="2" fill="#2a78d6"/><text x="32" y="50" font-size="38" font-weight="700" fill="#1f2328">−61 %</text><text x="32" y="76" font-size="16" fill="#59636e">de contexto en cada</text><text x="32" y="96" font-size="16" fill="#59636e">llamada al modelo</text><rect x="328.5" y="0.5" width="311" height="111" rx="12" fill="#f6f8fa" stroke="#d1d9e0"/><rect x="342" y="22" width="4" height="68" rx="2" fill="#2a78d6"/><text x="360" y="50" font-size="38" font-weight="700" fill="#1f2328">−69 %</text><text x="360" y="76" font-size="16" fill="#59636e">de tokens nuevos por llamada,</text><text x="360" y="96" font-size="16" fill="#59636e">los que más gastan de tu límite</text><rect x="0.5" y="128.5" width="311" height="111" rx="12" fill="#f6f8fa" stroke="#d1d9e0"/><rect x="14" y="150" width="4" height="68" rx="2" fill="#2a78d6"/><text x="32" y="178" font-size="38" font-weight="700" fill="#1f2328">−77 %</text><text x="32" y="204" font-size="16" fill="#59636e">de relecturas de ficheros</text><rect x="328.5" y="128.5" width="311" height="111" rx="12" fill="#f6f8fa" stroke="#d1d9e0"/><rect x="342" y="150" width="4" height="68" rx="2" fill="#2a78d6"/><text x="360" y="178" font-size="38" font-weight="700" fill="#1f2328">16 → 1</text><text x="360" y="204" font-size="16" fill="#59636e">compactaciones</text><text x="360" y="224" font-size="16" fill="#59636e">de la conversación</text><rect x="0.5" y="256.5" width="311" height="111" rx="12" fill="#f6f8fa" stroke="#d1d9e0"/><rect x="14" y="278" width="4" height="68" rx="2" fill="#2a78d6"/><text x="32" y="306" font-size="38" font-weight="700" fill="#1f2328">85 %</text><text x="32" y="332" font-size="16" fill="#59636e">nota correcta entre los</text><text x="32" y="352" font-size="16" fill="#59636e">5 primeros resultados</text><rect x="328.5" y="256.5" width="311" height="111" rx="12" fill="#f6f8fa" stroke="#d1d9e0"/><rect x="342" y="278" width="4" height="68" rx="2" fill="#2a78d6"/><text x="360" y="306" font-size="38" font-weight="700" fill="#1f2328">&lt; 30 s</text><text x="360" y="332" font-size="16" fill="#59636e">para instalarlo en</text><text x="360" y="352" font-size="16" fill="#59636e">Mac, Windows o Linux</text>
