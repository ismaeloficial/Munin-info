x="107" cy="374" r="52" fill="none" stroke="#3987e5" stroke-width="12" stroke-linecap="butt" stroke-dasharray="326.7 326.7" transform="rotate(-90 107 374)"/><text x="107" y="383" font-size="25" font-weight="700" text-anchor="middle" fill="#f0f6fc">100 %</text><text x="230" y="358" font-size="19" font-weight="600" fill="#f0f6fc">La conversación correcta salió</text><text x="230" y="384" font-size="19" font-weight="600" fill="#f0f6fc">la primera las 69 veces</text><text x="230" y="414" font-size="15" fill="#9198a1">Con tres palabras de un mensaje</text><text x="230" y="434" font-size="15" fill="#9198a1">de hace más de dos semanas</text>
