<svg xmlns="http://www.w3.org/2000/svg" width="640" height="448" viewBox="0 0 640 448" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'Noto Sans', Helvetica, Arial, sans-serif" role="img" aria-label="Search: the right note ranks first 65% of the time, in the top 3 80% of the time and in the top 5 85% of the time. In old conversations, the right one came first all 69 times.">
<title>Search: the right note ranks first 65% of the time, in the top 3 80% of the time and in the top 5 85% of the time. In old conversations, the right one came first all 69 times.</title>
<text x="0" y="22" font-size="19" font-weight="600" fill="#f0f6fc">In the notes: 20 real questions</text><circle cx="107" cy="106" r="52" fill="none" stroke="#0d366b" stroke-width="12"/><circle cx="107" cy="106" r="52" fill="none" stroke="#3987e5" stroke-width="12" stroke-linecap="round" stroke-dasharray="212.4 326.7" transform="rotate(-90 107 106)"/><text x="107" y="115" font-size="25" font-weight="700" text-anchor="middle" fill="#f0f6fc">65%</text><text x="107" y="192" font-size="17" text-anchor="middle" fill="#f0f6fc">ranked first</text><text x="107" y="214" font-size="15" text-anchor="middle" fill="#9198a1">13 of 20</text><circle cx="320" cy="106" r="52" fill="none" stroke="#0d366b" stroke-width="12"/><circle cx="320" cy="106" r="52" fill="none" stroke="#3987e5" stroke-width="12" stroke-linecap="round" stroke-dasharray="261.4 326.7" transform="rotate(-90 320 106)"/><text x="320" y="115" font-size="25" font-weight="700" text-anchor="middle" fill="#f0f6fc">80%</text><text x="320" y="192" font-size="17" text-anchor="middle" fill="#f0f6fc">in the top 3</text><text x="320" y="214" font-size="15" text-anchor="middle" fill="#9198a1">16 of 20</text><circle cx="533" cy="106" r="52" fill="none" stroke="#0d366b" stroke-width="12"/><circle cx="533" cy="106" r="52" fill="none" stroke="#3987e5" stroke-width="12" stroke-linecap="round" stroke-dasharray="277.7 326.7" transform="rotate(-90 533 106)"/><text x="533" y="115" font-size="25" font-weight="700" text-anchor="middle" fill="#f0f6fc">85%</text><text x="533" y="192" font-size="17" text-anchor="middle" fill="#f0f6fc">in the top 5</text><text x="533" y="214" font-size="15" text-anchor="middle" fill="#9198a1">17 of 20</text><line x1="0" y1="248" x2="640" y2="248" stroke="#3d444d" stroke-width="1"/><text x="0" y="290" font-size="19" font-weight="600" fill="#f0f6fc">In old conversations: 69 searches</text><circle cx="107" cy="374" r="52" fill="none" stroke="#0d366b" stroke-width="12"/><circle cx="107" cy="374" r="52" fill="none" stroke="#3987e5" stroke-width="12" stroke-linecap="butt" stroke-dasharray="326.7 326.7" transform="rotate(-90 107 374)"/><text x="107" y="383" font-size="25" font-weight="700" text-anchor="middle" fill="#f0f6fc">100%</text><text x="230" y="358" font-size="19" font-weight="600" fill="#f0f6fc">The right conversation came up</text><text x="230" y="384" font-size="19" font-weight="600" fill="#f0f6fc">first all 69 times</text><text x="230" y="414" font-size="15" fill="#9198a1">Using three words from a message</text><text x="230" y="434" font-size="15" fill="#9198a1">more than two weeks old</text>
</svg>
